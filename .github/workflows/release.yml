# Builds the release APKs (one per ABI) and publishes them as a GitHub release when a version tag
# is pushed:   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match pubspec.yaml's version. The app's "Check for updates" (Settings → About)
# reads the latest release and the APK for the phone's ABI (bpb-<version>-<abi>.apk).
#
# Repository secrets (Settings → Secrets and variables → Actions), for the release key:
#   KEYSTORE_BASE64     base64 of android/keystore/release.jks  (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the key's alias
#   KEY_PASSWORD        the key's password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match pubspec.yaml's version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit (built from source with the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird (Tor Project's expert bundles, hash-checked)
        run: bash scripts/fetch_tor.sh

      - name: Xray core (built from xray/ with gomobile and the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Routing data (Chocolate4U/Iran-v2ray-rules, latest)
        run: bash scripts/fetch_geo.sh

      - name: Tor bridges for the setup wizard (fresh each build)
        run: bash scripts/fetch_tor_bridges.sh

      - name: Minified worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - run: flutter pub get

      - run: flutter test

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without them the build would quietly use the debug key, and the APKs couldn't
          # update an installed release.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release key secrets are missing (see the top of this file)"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          {
            echo "storeFile=../keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --split-per-abi

      - name: Name the APKs and list their SHA-256
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/bpb-$VERSION-$abi.apk"
          done
          cd dist
          sha256sum bpb-*.apk > SHA256SUMS
          {
            echo '### SHA-256'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../checksums.md

      - uses: softprops/action-gh-release@v2
        with:
          name: BPB ${{ env.VERSION }}
          body_path: checksums.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
